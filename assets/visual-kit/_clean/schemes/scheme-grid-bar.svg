    <rect x="26" y="48" width="20" height="20"/>
    <rect x="48" y="48" width="20" height="20"/>
    <rect x="70" y="48" width="20" height="20"/>
    <rect x="92" y="48" width="20" height="20"/>
    <rect x="114" y="48" width="20" height="20"/>
    <rect x="136" y="48" width="20" height="20"/>
    <rect x="158" y="48" width="20" height="20"/>
    <rect x="180" y="48" width="20" height="20"/>
    <rect x="202" y="48" width="20" height="20"/>
    <!-- row 3 -->
    <rect x="4" y="70" width="20" height="20"/>
    <rect x="26" y="70" width="20" height="20"/>
    <rect x="48" y="70" width="20" height="20"/>
    <rect x="70" y="70" width="20" height="20"/>
