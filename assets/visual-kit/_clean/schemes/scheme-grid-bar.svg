    <rect x="48" y="4" width="20" height="20"/>
    <rect x="70" y="4" width="20" height="20"/>
    <rect x="92" y="4" width="20" height="20"/>
    <rect x="114" y="4" width="20" height="20"/>
    <rect x="136" y="4" width="20" height="20"/>
    <rect x="158" y="4" width="20" height="20"/>
    <rect x="180" y="4" width="20" height="20"/>
    <rect x="202" y="4" width="20" height="20"/>
    <!-- row 1 -->
