  <!-- elbow joint -->
  <circle cx="58.5" cy="92.5" r="3.4" stroke="currentColor" stroke-width="2.8"/>
  <!-- lower arm (elbow down to base) -->
  <path d="M58 96 C60 108 62 122 64 138" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- base: rounded weighted foot, confident -->
  <path d="M50 156 C50.4 150 53 145 60 143.6 C66.6 142.3 74 142.4 80 144 C86 145.6 88.6 150 89 156 C76 157.4 63 157.4 50 156 Z" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- neck into base -->
  <path d="M64 138 C64 140 65 142 66 143.6" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- desk line under everything -->
  <path d="M38 158 C70 159.2 120 159.4 168 157.4" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4-point brand spark glinting near the bulb / light -->
  <path d="M104 80 C104.3 83.6 105.9 85.2 109.5 85.5 C105.9 85.8 104.3 87.4 104 91 C103.7 87.4 102.1 85.8 98.5 85.5 C102.1 85.2 103.7 83.6 104 80 Z" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
