  <path d="M88 40 C88.4 36 89.6 33.4 92 33.2 C94.4 33 95.8 35.4 96 39.2" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shade rim detail -->
  <path d="M74 60 C82 64.4 96 65 110 60" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- upper arm of the lamp (from shade joint down to elbow) -->
