  <!-- paper sheet on the desk, slightly tilted, ink outline OVER the light cone -->
  <path d="M118 96 C117.4 110 117 128 117 150 C117 156 117.2 161 117.6 165 C131 165.6 145 165.4 158 164.6 C158.4 150 158.6 128 158.2 108 C158 102 157.6 97 157 93 C144 92.6 131 93 118 96 Z" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- handwritten "uu" scribble on the paper (like reference) -->
  <path d="M126 116 C125.6 121 125.4 126 127 127.6 C129 129.4 131 126 131.4 121.6 C131.6 119 131.8 117.4 132.2 116.4 C132.4 119 132.2 124 133.2 127.4 C133.8 129 135 129 136 127.6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M125 134 C124.4 140 124 146 126 148 C128.4 150.2 130.4 146 131 140.4 C131.2 137.6 131.4 135.8 131.8 134.8 C132 138 131.8 144 132.8 147.8 C133.4 150 135 150 136.4 148 C138 145.6 139 140 139.4 134" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lamp head / shade: bell-shaped, confident wobbly contour -->
  <path d="M70 56 C70 49 74 43 82 40 C90 37 100 37.4 108 41 C114 43.6 116.6 48 115 53 C113.4 58 107 62.4 100 64.6 C92 67 83 67 77 63.6 C72.6 61.2 70 58.6 70 56 Z" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
