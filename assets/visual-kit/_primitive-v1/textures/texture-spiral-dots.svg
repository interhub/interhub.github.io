<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <defs>
    <!-- open hand-drawn curl, ~9px, starts wide bottom-left, winds inward ~1.5 turns, tail left open -->
    <path id="curl" d="M3.6 6.4 Q-1.4 6.6 -1.4 2.4 Q-1.4 -2.2 3.4 -2.2 Q7.8 -2.2 7.8 1.8 Q7.8 5 4.6 5 Q2.4 5 2.4 3" />
  </defs>
  <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- row 1 y~9 -->
    <use href="#curl" x="6" y="9" />
    <use href="#curl" x="22" y="9" />
    <use href="#curl" x="38" y="9" />
    <use href="#curl" x="54" y="9" />
    <use href="#curl" x="70" y="9" />
    <!-- row 2 y~24 offset -->
    <use href="#curl" x="-2" y="24" />
    <use href="#curl" x="14" y="24" />
    <use href="#curl" x="30" y="24" />
    <use href="#curl" x="46" y="24" />
    <use href="#curl" x="62" y="24" />
    <use href="#curl" x="78" y="24" />
    <!-- row 3 y~39 -->
    <use href="#curl" x="6" y="39" />
    <use href="#curl" x="22" y="39" />
    <use href="#curl" x="38" y="39" />
    <use href="#curl" x="54" y="39" />
    <use href="#curl" x="70" y="39" />
    <!-- row 4 y~54 offset -->
    <use href="#curl" x="-2" y="54" />
    <use href="#curl" x="14" y="54" />
    <use href="#curl" x="30" y="54" />
    <use href="#curl" x="46" y="54" />
    <use href="#curl" x="62" y="54" />
    <use href="#curl" x="78" y="54" />
    <!-- row 5 y~69 -->
    <use href="#curl" x="6" y="69" />
    <use href="#curl" x="22" y="69" />
    <use href="#curl" x="38" y="69" />
    <use href="#curl" x="54" y="69" />
    <use href="#curl" x="70" y="69" />
  </g>
</svg>
