        <article>
          <p>AI Integration · Fullstack Engineer · Tech Lead · Consulting.</p>
          <h1>I integrate AI into real business and own the creation of strong IT products from scratch.</h1>
          <p>More than six years helping IT companies worldwide reach their goals.</p>

          <h2>Results delivered</h2>
          <ul>
            <li>2 large products in the USA taken to market.</li>
            <li>8 mid-size businesses in Russia taken to market.</li>
            <li>24 sites and apps helping entrepreneurs.</li>
            <li>100+ agents and harnesses automating business processes.</li>
          </ul>

          <h2>What I use.</h2>
          <ul>
            <li><strong>AI &amp; Automation:</strong> Claude Code, AI Agents, Prompt Engineering, N8N, Cursor, AI workflow automation.</li>
            <li><strong>Frontend &amp; Mobile:</strong> React, React Native, SPA, TypeScript, Zustand, Expo.</li>
            <li><strong>Backend &amp; Data:</strong> Node.js, Nest.js, Next.js, PostgreSQL, MongoDB, Supabase, Redis, RabbitMQ, Microservices.</li>
            <li><strong>DevOps &amp; Cloud:</strong> Docker, Dokploy, CI/CD, Google Cloud, AWS, Grafana, Loki, Nginx, Traefik.</li>
          </ul>
          <h3>Technical management</h3>
          <p>I run engineering and design whole systems end to end, from architecture to release. I set up the processes inside the company and the product, build the technical roadmap, and bring AI into business workflows so the team moves faster and more predictably.</p>
          <p>W3-certified in TypeScript and React. Fluent in English. Hackathon prize winner, 2022.</p>

          <h2>Projects and companies</h2>
          <p>Companies where I built the processes, owned the product and the whole technical side, and helped the team grow.</p>
          <ul>
            <li><a href="https://app.painta.io">Painta</a> - Architecture and fullstack of an AI product (team of 2). An AI drawing coach for iOS, Android, iPad and web: MVP in the App Store in 36 days, 2,000+ commits, 10k+ users and 4.5 stars. Supabase backend, Adapty and Stripe subscriptions, AI features, and AI agents for analytics, marketing and testing.</li>
            <li><a href="https://www.aspect-health.com">Aspect Health</a> - Fullstack engineer and team lead (team of 5). A US women-health platform with $300k+ yearly revenue: 4 Node.js services on Google Cloud, about 315 endpoints and 30+ integrations, Stripe payments with no double charges, an app reading glucose sensors over NFC, and company-wide QA.</li>
            <li><a href="https://nana800.io">Nana800</a> - Founder and fullstack developer. My own low-code platform for backend logic and automation: 73 block types, 54 integrations, 7 NestJS services, and an MCP server with 44 tools that lets AI agents build scenarios on their own.</li>
            <li><a href="https://sport.mos.ru/">Moscow Sport</a> - Mobile engineer (team of 5). The Moscow city sport app: after a failed contractor we brought its features back and re-released it to the App Store and Google Play. Venues, events, coaches, a QR scanner, and my YooKassa payment module for React Native.</li>
            <li><a href="https://www.vtb.ru/invest/">VTB Investments</a> - React Native developer (Cloud Factory). The investment app of one of Russia's largest banks: React Native screens and API work, fixing issues found by the bank's QA team, code review and staged releases.</li>
            <li><a href="https://stayfitt.ru/">Stayfit</a> - Fullstack engineer (React Native, Node.js). A corporate health platform, named the best innovation in Russian corporate sport in 2022: sport challenges and an activity feed on React Native and Node.js microservices with GraphQL, 4.5 stars from 1,100+ ratings.</li>
            <li><a href="https://bismap.net/">Bismap</a> - Backend and mobile (solo developer). A B2B tenders app: business registration, applications, and the full backend, then handed to the client to run.</li>
            <li><a href="https://www.bigam.ru/">Bigam</a> - Mobile engineer and tech lead. A hardware-store chain app: catalog, delivery, payments, and a Node.js backend that syncs stock from 1C. 100k+ downloads and a 5.0 rating on Google Play.</li>
            <li><a href="https://groupq-ural.ru/">GroupQ</a> - Mobile engineer and backend. A fuel-station loyalty app: fuel bonuses, promos, and a station map on the Yandex API, with Node.js microservices pulling data from 1C. 10k+ downloads.</li>
            <li>CoRegulate - Mobile and backend engineer. A meditation app on React Native and Expo: Firebase Cloud Functions and Firestore backend, Adapty subscriptions, and push notifications.</li>
            <li><a href="https://apps.apple.com/ru/app/small/id1535215720">Small</a> - Mobile engineer (tech team of 3). A cashier-free supermarket app: shop without checkout lines via QR and barcode scanning and in-app payment by card, Google Pay, or Apple Pay.</li>
            <li><a href="https://vk.com/lkcafe">Liverpool</a> - Mobile lead and team lead. A food-delivery app for a restaurant chain: menu, ordering, SberPay and card payments, and real-time delivery tracking over web sockets.</li>
            <li>BoxLab - Web engineer (3D). A 3D packaging configurator right in the browser on Three.js and WebGL: the box model is built and rotated in real time, plus maps for delivery.</li>
            <li><a href="https://ageevastom.ru">Ageeva Stom</a> - Web (clinic site). A private dental clinic site in Kaliningrad: trust, services, booking, and directions.</li>
            <li><a href="http://solnechnayaarka.ru">Solnechnaya Arka</a> - Web (catalog store). A greenhouse and garden-structures storefront: catalog, benefits, delivery, and leads.</li>
            <li><a href="https://pro-fitness-39.ru">ProFitness</a> - Web (chain landing). A fitness-chain site across four locations: services and first client contact.</li>
          </ul>

          <h2>About</h2>
          <p>Six years now building products and levelling up IT teams. My projects span wellness, women health, sport &amp; fitness, art, retail and sales, AI systems for B2B and B2C. Products and teams in the US, the UK and Russia. I own the product and the whole technical side: architecture, releases and infrastructure. I run interviews and negotiations in English. I bring AI agents into how companies work.</p>
          <p>I keep a small personal blog about IT business and development: <a href="https://www.instagram.com/stepan_turchenko/">Instagram</a>.</p>
          <p>I play padel and box a little, own a dog, and follow economics and technology.</p>

          <h2>Frequently asked questions</h2>
          <h3>Who is Stepan Turchenko?</h3>
          <p>Stepan Turchenko is an AI integration specialist, fullstack engineer, tech lead and consultant from Kaliningrad, Russia. For more than six years he has built products and grown IT teams in the US, the UK and Russia. He owns the product and the whole technical side: architecture, releases and infrastructure.</p>
          <h3>What does Stepan Turchenko do in AI integration?</h3>
          <p>He builds AI agents and the harnesses around them and connects them to the tools a company already uses, so agents take over routine work. He has built more than 100 agents and harnesses that automate business processes. In Painta, AI agents handle analytics, marketing and testing. His platform Nana800 has an MCP server with 44 tools that lets AI agents build scenarios on their own.</p>
          <h3>What can you hire Stepan Turchenko for?</h3>
          <p>Bringing AI agents and automation into business processes, building an IT product from scratch, leading engineering as a tech lead, or consulting on product and technology.</p>
          <h3>What is Stepan Turchenko's tech stack?</h3>
          <p>AI and automation: Claude Code, AI agents, prompt engineering, N8N, Cursor. Frontend and mobile: React, React Native, TypeScript, Zustand, Expo. Backend and data: Node.js, Nest.js, Next.js, PostgreSQL, MongoDB, Supabase, Redis, RabbitMQ. DevOps and cloud: Docker, Dokploy, CI/CD, Google Cloud, AWS, Grafana, Loki, Nginx, Traefik.</p>
          <h3>What projects has Stepan Turchenko built?</h3>
          <p>He has taken 2 large products to market in the USA and 8 mid-size businesses in Russia, built 24 sites and apps for entrepreneurs and more than 100 agents and harnesses. Projects include Painta, an AI drawing coach with 10k+ users; Aspect Health, a US women-health platform with $300k+ yearly revenue; Nana800, his own low-code automation platform; Moscow Sport, the Moscow city sport app; and VTB Investments, the investment app of one of Russia's largest banks.</p>
          <h3>Where is Stepan Turchenko based and what languages does he speak?</h3>
          <p>He lives in Kaliningrad, Russia, and works with companies worldwide. Russian is his native language. He speaks English fluently and runs interviews and negotiations in English.</p>
          <h3>How do I contact Stepan Turchenko?</h3>
          <p>Telegram is the preferred channel: https://t.me/Stepan_Turchenko. Email: stepanstepan4@gmail.com. Phone: +7 962 263 98 09. LinkedIn: https://www.linkedin.com/in/stepanturchenko.</p>

          <h2>Write me about your product.</h2>
          <p>I own the technical side and the result.</p>
          <ul>
            <li>Telegram (preferred): <a href="https://t.me/Stepan_Turchenko">t.me/Stepan_Turchenko</a></li>

            <li>LinkedIn: <a href="https://www.linkedin.com/in/stepanturchenko">linkedin.com/in/stepanturchenko</a></li>
            <li>Instagram: <a href="https://www.instagram.com/stepan_turchenko/">@stepan_turchenko</a></li>
            <li>GitHub: <a href="https://github.com/interhub">github.com/interhub</a></li>
          </ul>
