        <article>
          <p>Внедрение AI · Fullstack Engineer · Техлид · Консультации.</p>
          <h1>Я внедряю AI в бизнес и отвечаю за создание крутых айти продуктов с нуля</h1>
          <p>Более 6 лет помогаю айти компаниям по всему миру достигать цели.</p>

          <h2>Результаты достигнуты</h2>
          <ul>
            <li>2 крупных продукта в США выведены на рынок.</li>
            <li>8 средних бизнесов РФ выведены на рынок.</li>
            <li>24 сайта и приложения помогают предпринимателям.</li>
            <li>100+ агентов и обвязок автоматизируют бизнес-процессы.</li>
          </ul>

          <h2>Что я использую.</h2>
          <ul>
            <li><strong>ИИ и автоматизация:</strong> Claude Code, AI Agents, Prompt Engineering, N8N, Cursor, AI workflow automation.</li>
            <li><strong>Фронтенд и мобильное:</strong> React, React Native, SPA, TypeScript, Zustand, Expo.</li>
            <li><strong>Backend и данные:</strong> Node.js, Nest.js, Next.js, PostgreSQL, MongoDB, Supabase, Redis, RabbitMQ, Microservices.</li>
            <li><strong>DevOps и облако:</strong> Docker, Dokploy, CI/CD, Google Cloud, AWS, Grafana, Loki, Nginx, Traefik.</li>
          </ul>
          <h3>Технический менеджмент</h3>
          <p>Управляю разработкой и проектирую системы целиком: от архитектуры до релиза. Налаживаю процессы внутри компании и продукта, строю технический план развития и внедряю ИИ в рабочие процессы бизнеса, чтобы команда двигалась быстрее и предсказуемее.</p>
          <p>Сертификаты W3 по TypeScript и React. Свободно говорю по-английски. Призёр хакатона 2022 года.</p>

          <h2>Проекты и компании</h2>
          <p>Компании, где я строил процессы, отвечал за продукт и всю техническую часть, помогал команде расти.</p>
          <ul>
            <li><a href="https://app.painta.io">Painta</a> - Архитектура и fullstack AI-продукта (команда из 2). AI-наставник по рисованию для iOS, Android, iPad и веба: MVP в App Store за 36 дней, 2 000+ коммитов, 10 тыс.+ пользователей и 4,5 звезды. Бэкенд на Supabase, подписки Adapty и Stripe, ИИ-функции и ИИ-агенты для аналитики, маркетинга и тестов.</li>
            <li><a href="https://www.aspect-health.com">Aspect Health</a> - Fullstack-инженер и тимлид (команда из 5). Американская платформа о женском здоровье с выручкой $300 тыс.+ в год: 4 сервиса на Node.js в Google Cloud, около 315 эндпоинтов и 30+ интеграций, платежи Stripe без двойных списаний, приложение с датчиками глюкозы по NFC и QA на всю компанию.</li>
            <li><a href="https://nana800.io">Nana800</a> - Основатель и fullstack-разработчик. Моя low-code платформа для бэкенд-логики и автоматизаций: 73 типа блоков, 54 интеграции, 7 сервисов на NestJS и MCP-сервер с 44 инструментами, через который ИИ-агенты сами собирают сценарии.</li>
            <li><a href="https://sport.mos.ru/">Московский спорт</a> - Мобильный инженер (команда из 5). Городское спортивное приложение Москвы: после неудачного подрядчика вернули функции и заново выпустили его в App Store и Google Play. Площадки, события, тренеры, QR-сканер и мой модуль оплаты ЮKassa для React Native.</li>
            <li><a href="https://www.vtb.ru/invest/">ВТБ Инвестиции</a> - React Native разработчик (Cloud Factory). Инвестиционное приложение одного из крупнейших банков России: экраны и работа с API на React Native, исправление ошибок от QA-команды банка, код-ревью и поэтапные релизы.</li>
            <li><a href="https://stayfitt.ru/">Stayfit</a> - Fullstack-инженер (React Native, Node.js). Корпоративная платформа о здоровье, лучшая инновация в корпоративном спорте России 2022 года: спортивные челленджи и лента активности на React Native и микросервисах Node.js с GraphQL, 4,5 звезды по 1 100+ оценкам.</li>
            <li><a href="https://bismap.net/">Bismap</a> - Backend и мобильное (один разработчик). B2B-приложение для тендеров: регистрация бизнеса, заявки и весь backend, передано заказчику в самостоятельное управление.</li>
            <li><a href="https://www.bigam.ru/">Bigam</a> - Мобильный инженер и тех-лид. Приложение сети строительных магазинов: каталог, доставка, оплата и бэкенд на Node.js, который синхронизирует остатки из 1С. 100 тыс.+ загрузок и оценка 5,0 в Google Play.</li>
            <li><a href="https://groupq-ural.ru/">GroupQ</a> - Мобильный инженер и backend. Приложение лояльности сети АЗС: бонусы за заправку, акции и карта станций на API Яндекса, микросервисы на Node.js забирают данные из 1С. 10 тыс.+ загрузок.</li>
            <li>CoRegulate - Мобильный и backend-инженер. Приложение для медитаций на React Native и Expo: бэкенд на Firebase Cloud Functions и Firestore, подписки через Adapty и push-уведомления.</li>
