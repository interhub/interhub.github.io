        <article>
          <p>AI 集成 · 全栈工程师 · 技术负责人 · 咨询。</p>
          <h1>把 AI 落地到企业真实业务，并负责从零打造出色的 IT 产品。</h1>
          <p>六年多帮助全球 IT 公司实现目标。</p>

          <h2>成果已达成</h2>
          <ul>
            <li>2 个美国大型产品已推向市场。</li>
            <li>8 家俄罗斯中型企业已推向市场。</li>
            <li>24 个网站与应用帮助创业者。</li>
            <li>100+ 智能体与外围系统自动化业务流程。</li>
          </ul>

          <h2>我使用什么。</h2>
          <ul>
            <li><strong>AI 与自动化：</strong>Claude Code、AI Agents、Prompt Engineering、N8N、Cursor、AI workflow automation。</li>
            <li><strong>前端与移动端：</strong>React、React Native、SPA、TypeScript、Zustand、Expo。</li>
            <li><strong>后端与数据：</strong>Node.js、Nest.js、Next.js、PostgreSQL、MongoDB、Supabase、Redis、RabbitMQ、Microservices。</li>
            <li><strong>DevOps 与云：</strong>Docker、Dokploy、CI/CD、Google Cloud、AWS、Grafana、Loki、Nginx、Traefik。</li>
          </ul>
          <h3>技术管理</h3>
          <p>我端到端地管理研发并设计整套系统，从架构一直到发布。我在公司和产品内部理顺流程，制定技术发展规划，并把 AI 落地到业务流程中，让团队推进得更快、更可预期。</p>
          <p>持有 W3 的 TypeScript 与 React 认证。英语流利。2022 年黑客松获奖者。</p>

          <h2>项目与公司</h2>
          <p>这些公司里，我搭建流程，对产品和整个技术面负责，并帮助团队成长。</p>
          <ul>
            <li><a href="https://app.painta.io">Painta</a> - AI 产品架构与全栈（2 人团队）。面向 iOS、Android、iPad 和网页的 AI 绘画导师：36 天将 MVP 上架 App Store，2000+ 次提交，1 万+ 用户，4.5 星评分。Supabase 后端，Adapty 与 Stripe 订阅，AI 功能，以及用于分析、营销和测试的 AI 智能体。</li>
            <li><a href="https://www.aspect-health.com">Aspect Health</a> - 全栈工程师兼团队负责人（5 人团队）。一个年收入 30 万美元以上的美国女性健康平台：在 Google Cloud 上构建 4 个 Node.js 服务、约 315 个接口和 30+ 项集成，Stripe 支付杜绝重复扣款，应用通过 NFC 读取血糖传感器，并建立全公司 QA。</li>
            <li><a href="https://nana800.io">Nana800</a> - 创始人兼全栈开发。我自己的后端逻辑与自动化低代码平台：73 种模块、54 项集成、7 个 NestJS 服务，以及拥有 44 个工具的 MCP 服务器，让 AI 智能体自行搭建场景。</li>
            <li><a href="https://sport.mos.ru/">莫斯科体育</a> - 移动端工程师（5 人团队）。莫斯科城市体育应用：在前任外包失败后，我们恢复了功能并重新上架 App Store 和 Google Play。场馆、活动、教练、二维码扫描，以及我为 React Native 编写的 YooKassa 支付模块。</li>
            <li><a href="https://www.vtb.ru/invest/">VTB 投资</a> - React Native 开发（Cloud Factory）。俄罗斯最大银行之一的投资应用：用 React Native 开发页面与 API 对接，修复银行 QA 团队发现的问题，参与代码评审与分阶段发布。</li>
            <li><a href="https://stayfitt.ru/">Stayfit</a> - 全栈工程师 (React Native, Node.js)。企业健康平台，2022 年俄罗斯企业体育最佳创新：基于 React Native 与 GraphQL 的 Node.js 微服务开发运动挑战与动态流，App Store 1100+ 条评分达 4.5 星。</li>
            <li><a href="https://bismap.net/">Bismap</a> - 后端与移动端（独立开发）。一款 B2B 招投标应用：企业注册、投标申请以及完整后端，随后交付给客户自主运营。</li>
            <li><a href="https://www.bigam.ru/">Bigam</a> - 移动工程师兼技术负责人。一款建材连锁应用：商品目录、配送、支付，以及从 1C 同步库存的 Node.js 后端。10 万+ 下载，Google Play 评分 5.0。</li>
            <li><a href="https://groupq-ural.ru/">GroupQ</a> - 移动工程师与后端。一款加油站会员应用：加油积分、促销和基于 Yandex API 的站点地图，Node.js 微服务从 1C 获取数据。1 万+ 下载。</li>
            <li>CoRegulate - 移动端与后端工程师。一款基于 React Native 与 Expo 的冥想应用：Firebase Cloud Functions 与 Firestore 后端，Adapty 订阅与推送通知。</li>
            <li><a href="https://apps.apple.com/ru/app/small/id1535215720">Small</a> - 移动工程师（3 人技术团队）。一款无收银台超市应用：通过扫描二维码和条形码免排队购物，并支持应用内银行卡、Google Pay 或 Apple Pay 支付。</li>
            <li><a href="https://vk.com/lkcafe">Liverpool</a> - 移动端负责人兼团队负责人。一款连锁餐厅的外卖应用：菜单、下单、SberPay 与银行卡支付，以及基于 WebSocket 的实时配送追踪。</li>
            <li>BoxLab - 网页工程师（3D）。直接在浏览器中运行的 3D 包装设计器，基于 Three.js 与 WebGL：盒子模型实时生成并可旋转，并带有配送地图。</li>
            <li><a href="https://ageevastom.ru">Ageeva Stom</a> - 网站（诊所）。加里宁格勒一家私立牙科诊所的网站：信任感、服务项目、预约与导航。</li>
            <li><a href="http://solnechnayaarka.ru">Solnechnaya Arka</a> - 网站（商品目录）。一个温室与花园结构的展示商店：商品目录、优势、配送与销售线索。</li>
            <li><a href="https://pro-fitness-39.ru">ProFitness</a> - 网站（连锁落地页）。一个覆盖四个门店的连锁健身网站：服务介绍与客户首次联系。</li>
          </ul>

          <h2>关于</h2>
          <p>六年来我打造产品，并帮助 IT 团队成长。我的项目涵盖 wellness、女性健康、运动健身、艺术、零售与销售、AI B2B 与 B2C 系统，产品与团队分布在美国、英国和俄罗斯。产品和整个技术面归我：架构、发布与基础设施。面试和谈判用英语。把 AI 智能体带进企业的日常工作。</p>
          <p>我写一个关于 IT 业务与开发的小型个人博客：<a href="https://www.instagram.com/stepan_turchenko/">Instagram</a>。</p>
          <p>打板式网球（padel），也练一点拳击，养狗，关注经济与技术。</p>

          <h2>写信聊聊你的产品。</h2>
          <p>技术部分和结果由我负责。</p>

            <li>Telegram（首选联系方式）：<a href="https://t.me/Stepan_Turchenko">t.me/Stepan_Turchenko</a></li>

            <li>LinkedIn：<a href="https://www.linkedin.com/in/stepanturchenko">linkedin.com/in/stepanturchenko</a></li>

            <li>GitHub：<a href="https://github.com/interhub">github.com/interhub</a></li>
          </ul>
          <p>网站语言版本：<a href="https://personal-info.ru/" hreflang="ru" lang="ru">Русский</a>、<a href="https://personal-info.ru/en/" hreflang="en" lang="en">English</a>、<a href="https://personal-info.ru/zh/" hreflang="zh" lang="zh">中文</a>。</p>
